<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>CLIPPATH SEMANA 6</title>
    <style> 
        *{
            padding: 0px;
            margin: 0px;

        }
        body {

            background-image: url(img/fondopg.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            }

        .contenedor{
            width: 3500px;
            height: 1900px;
            border: 1px solid black;
            position:relative;
            margin:0 auto;
            overflow: hidden;


            background-image: url(img/fondo.png);
            background-size: cover;
            background-position: center;

        }



        .marco1{
            width: 5000px;
            height: 2400px;
            background-image: url(img/neblina.png);
            background-size: cover;
            clip-path: inset(5% 0 15% 0);

            position: absolute;
            top: -120px;
            left: 0px;
            z-index: 8;


            animation: despejarIzquierda 2.5s ease-in-out forwards;
            animation-delay: 3s;

        }

        @keyframes despejarIzquierda {
            from {
                left: 0px;
            }
            to {
                left: -5500px;
            }
        }

        

        .marco2{
            width: 5000px;
            height: 2400px;
            background-image: url(img/neblinader.png);
            background-size: cover;
            clip-path: inset(5% 0 15% 0);

            position: absolute;
            top: -150px;
            left: -1500px;
            z-index: 8;


            animation: despejarDerecha 2.5s ease-in-out forwards;
            animation-delay: 3s;

        }

        @keyframes despejarDerecha {
            from {
                left: -1500px;
            }
            to {
                left: 3500px;
            }
        }



        .marco3{
            width: 2700px;
            height: 1500px;
            background-image: url(img/TENTACULOS.png);
            background-size: cover;
            clip-path: inset(5% 0 15% 0);

            position: absolute;
            top: -80px;
            left: 300px;
            z-index: 7;

            animation: hundirTentaculo 3s ease-in forwards;

        }

        @keyframes hundirTentaculo {
            from {
                top: -80px;
            }
            to {
                top: 2000px;
            }
        }

        .marco4{
            width: 1300px;
            height: 600px;
            background-image: url(img/personaherida.png);
            background-size: cover;
            clip-path: inset(5% 0 15% 0);

            position: absolute;
            top: 1390px;
            left: 1100px;
            z-index: 6;

            animation: ocultarpersona 1.5s ease-in forwards;
            animation-delay: 6.4s;
        }

        @keyframes ocultarpersona {
            from {
                top: 1390px;
            }
            to {
                top: 3000px;
            }
        }




        .marco5{
        width: 10000px;
        height: 2400px;
        background-image: url(img/neblina.png);
        background-size: cover;
        clip-path: inset(5% 0 15% 0);

        position: absolute;
        top: -120px;
        left: -5500px;
        z-index: 8;

   
        animation: reutilizarIzquierda 6s ease-in-out forwards;
        animation-delay: 5.5s;
        }

        @keyframes reutilizarIzquierda {
            0% {
                left: -5500px;
               }
            15% {
                left: 0px;
                }
            85% {
                left: 0px;
                }
            100% {
                left: -5500px;
                }
        }


        .marco6{
        width: 10000px;
        height: 2400px;
        background-image: url(img/neblinader.png);
        background-size: cover;
        clip-path: inset(5% 0 15% 0);

        position: absolute;
        top: -150px;
        left: 2500px;
        z-index: 8;


        animation: reutilizarDerecha 6s ease-in-out forwards;
        animation-delay: 5.5s;
    }

        @keyframes reutilizarDerecha {
        0% {
            left: 3500px;
           }
        15% {
            left: -6500px;
            }
        85% {
            left: -6500px;
            }
        100% {
            left: 3500px;
            }
    }

    .marco7{
            width: 3500px;
            height: 2500px;
            background-image: url(img/monstruo.gif);
            background-size: cover;
            clip-path: inset(5% 0 15% 0);

            position: absolute;
            top: 1800px;
            left: 0px;
            z-index: 6;

            animation: mostrarmonstruo 5s ease-in forwards;
            animation-delay: 5.5s;
        }

        @keyframes mostrarmonstruo {
            from {  
                top: 1800px;
            }
            to {
                top: -180px;
            }
        }

    a{
    display:block;
    width:250px;
    background-color:#2563eb;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    margin:auto;
    font-size:20px;
    font-family:Arial;
    font-weight:bold;
    border-radius:10px;
    box-shadow:0px 0px 10px black;
    transition:1s;
    }

    a:hover{
    background-color:black;
    transform:scale(1.1);
    }


    </style>        
</head>
<body>
    <div class="contenedor">

            <div class="marco1"></div>
            <div class="marco2"></div>
            <div class="marco3"></div>
            <div class="marco4"></div>
            <div class="marco5"></div>
            <div class="marco6"></div>
            <div class="marco7"></div>

    </div>
    <div class="reproductor">
        <h3>Audio</h3>
        <audio src="./img/sonido.mp3" controls autoplay></audio>
    </div>

<br><br>

<a href="../index.html"> VOLVER AL INICIO</a>

</body>
</html>
