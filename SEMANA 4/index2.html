<html>
    <head>
        <title>VISITA PERÚ</title>

        <style>

            *{
                margin:0px;
                padding:0px;
                background-color: black;
            }

            .contenedor{
                width:800px;
                height:300px;
                position:relative;
                margin:0 auto;
                border:1px solid white;
                overflow:hidden;
            }

            .marco1{
                width:160px;
                height:300px;
                background-color:red;
                position:absolute;
                top:0px;
                left:0px;

                animation:marco1 2s 1 forwards;

                background-image:url(img/css.jpg);
                background-size:cover;
            }

            @keyframes marco1{

                0%{
                    top:-300px;
                    left:0px;
                    transform:rotateZ(180deg);
                }

                50%{
                    top:300px;
                    left:0px;
                }

                100%{
                    top:0px;
                    left:0px;
                    transform:rotateZ(0deg);
                }

            }

            .marco2{
                width:160px;
                height:300px;
                background-color:green;
                position:absolute;
                top:-300px;
                left:160px;

                animation:marco2 2s 1 forwards 2s;

                background-image:url(img/html.jpg);
                background-size:cover;
            }

            @keyframes marco2{

                0%{
                    top:0px;
                    left:-300px;
                    transform:rotateZ(180deg);
                }

                50%{
                    top:0px;
                    left:300px;
                }

                100%{
                    top:0px;
                    left:160px;
                    transform:rotateZ(0deg);
                }

            }

            .marco3{
                width:160px;
                height:300px;
                background-color:yellowgreen;
                position:absolute;
                top:-300px;
                left:320px;

                animation:marco3 2s 1 forwards 4s;

                background-image:url(img/javascript.jpg);
                background-size:cover;
            }

            @keyframes marco3{

                0%{
                    top:300px;
                    left:320px;
                    transform:rotateZ(180deg);
                }

                50%{
                    top:-300px;
                    left:320px;
                }

                100%{
                    top:0px;
                    left:320px;
                    transform:rotateZ(0deg);
                }

            }

            .marco4{
                width:160px;
                height:300px;
                background-color:blue;
                position:absolute;
                top:-300px;
                left:480px;

                animation:marco4 2s 1 forwards 6s;

                background-image:url(img/json.jpg);
                background-size:cover;
            }

            @keyframes marco4{

                0%{
                    top:0px;
                    left:900px;
                    transform:rotateZ(180deg);
                }

                50%{
                    top:0px;
                    left:200px;
                }

                100%{
                    top:0px;
                    left:480px;
                    transform:rotateZ(0deg);
                }

            }

            .marco5{
                width:160px;
                height:300px;
                background-color:rgb(0, 238, 255);
                position:absolute;
                top:-300px;
                left:640px;

                animation:marco5 2s 1 forwards 8s;

                background-image:url(img/php.jpg);
                background-size:cover;
            }

            @keyframes marco5{

                0%{
                    top:-300px;
                    left:640px;
                    transform:rotateZ(180deg);
                }

                50%{
                    top:150px;
                    left:640px;
                }

                100%{
                    top:0px;
                    left:640px;
                    transform:rotateZ(0deg);
                }

            }
            
            .texto{
                width:800px;
                height:50px;
                position:absolute;
                top:120px;
                left:-900px;
                background:transparent;

                color:white;
                font-size:40px;
                text-align:center;
                font-family:Arial;
                font-weight:bold;
                letter-spacing:3px;
                text-shadow:5px 5px 10px black;

                animation:texto 3s 1 forwards 10s;
            }

            @keyframes texto{

                0%{
                    left:-900px;
                    transform:rotateZ(-20deg);
                }

                50%{
                    left:100px;
                    transform:rotateZ(20deg);
                }

                100%{
                    left:0px;
                    transform:rotateZ(0deg);
                }

            }
    a{
    display:block;
    width:250px;
    background-color:#2563eb;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:15px;
    margin:auto;
    font-size:20px;
    font-family:Arial;
    font-weight:bold;
    border-radius:10px;
    box-shadow:0px 0px 10px black;
    transition:1s;
    }

    a:hover{
    background-color:black;
    transform:scale(1.1);
    }


        </style>

    </head>

    <body>

        <div class="contenedor">

            <div class="marco1"></div>
            <div class="marco2"></div>
            <div class="marco3"></div>
            <div class="marco4"></div>
            <div class="marco5"></div>
            <div class="texto">Tecnologias de Desarrollo web </div>

        </div>

<br><br>

<a href="../index.html"> VOLVER AL INICIO</a>

    </body>

</html>
